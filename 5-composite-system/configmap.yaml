# Non-secret config shared by the app (TASK 1). Provided complete.
# POSTGRES_HOST is the hostname the backend will use to reach the database — it must
# match the name of the database Service you create in TASK 2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_DB: example
  POSTGRES_HOST: database
  # Mounted into the postgres container at /docker-entrypoint-initdb.d/ — runs once on
  # first DB initialisation (empty PGDATA) to create the GREETINGS table.
  schema.sql: |
    CREATE TABLE IF NOT EXISTS GREETINGS (
        id UUID PRIMARY KEY,
        name varchar(50) NOT NULL UNIQUE
    );
