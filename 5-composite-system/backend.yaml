# SOLUTION — app tier (module 5, TASK 3). Verified on Rancher Desktop / k3s.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # BONUS 4: uncomment initContainers to replace the manual "Seed default data" button.
      # The init container runs to completion BEFORE the backend starts:
      #   1. waits until Postgres accepts connections (pg_isready loop),
      #   2. creates the schema (idempotent — CREATE TABLE IF NOT EXISTS),
      #   3. inserts the default rows (ON CONFLICT DO NOTHING).
      # The Pod stays in Init:0/1 until this succeeds, then the backend container starts.
      #
      # initContainers:
      #   - name: migrate
      #     image: postgres:18.3-alpine3.23   # same image as the DB tier — psql is included
      #     env:
      #       - name: POSTGRES_DB
      #         valueFrom:
      #           configMapKeyRef:
      #             name: app-config
      #             key: POSTGRES_DB
      #       - name: POSTGRES_HOST
      #         valueFrom:
      #           configMapKeyRef:
      #             name: app-config
      #             key: POSTGRES_HOST
      #       - name: POSTGRES_PASSWORD
      #         valueFrom:
      #           secretKeyRef:
      #             name: db-credentials
      #             key: password
      #     command:
      #       - sh
      #       - -c
      #       - |
      #         until pg_isready -h $POSTGRES_HOST -p 5432; do
      #           echo "waiting for postgres..."; sleep 2
      #         done
      #         psql postgresql://postgres:$POSTGRES_PASSWORD@$POSTGRES_HOST/$POSTGRES_DB -c "
      #           CREATE TABLE IF NOT EXISTS GREETINGS (
      #               id UUID PRIMARY KEY,
      #               name varchar(50) NOT NULL UNIQUE
      #           );
      #           INSERT INTO GREETINGS(id, name)
      #           VALUES (gen_random_uuid(), 'Docker container'),
      #                  (gen_random_uuid(), 'An awesome workshop'),
      #                  (gen_random_uuid(), 'The Future')
      #           ON CONFLICT (name) DO NOTHING;
      #         "
      containers:
        - name: backend
          image: ghcr.io/notalib/workshop-containerisation/edu-spring-boot:1.2
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          # readiness gates traffic: the Pod joins the Service only once /readyz returns
          # 200, which avoids the brief 502 while Spring is still starting.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          # liveness restarts the container if /healthz stops responding (process-only,
          # no DB check). The generous initialDelaySeconds lets Spring boot first.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greetings
spec:
  ingressClassName: traefik
  rules:
    - host: greetings.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
