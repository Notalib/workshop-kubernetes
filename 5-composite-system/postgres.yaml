# SOLUTION — database tier (module 5, TASK 2). Verified on Rancher Desktop / k3s.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: postgres:18.3-alpine3.23
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          volumeMounts:
            # postgres:18+ stores data in a version subdir under /var/lib/postgresql,
            # so mount the PVC at the parent (matches Workshop #1's compose).
            - name: data
              mountPath: /var/lib/postgresql
            # Runs once on first DB init (empty PGDATA) to create the GREETINGS table.
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: initdb
          configMap:
            name: app-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: database       # matches POSTGRES_HOST in app-config (and the backend's env)
spec:
  selector:
    app: database
  ports:
    - port: 5432
      targetPort: 5432
