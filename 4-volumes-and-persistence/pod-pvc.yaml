# SOLUTION — completed Pod that mounts the PVC at /data (module 3, TASK 2 + 3).
apiVersion: v1
kind: Pod
metadata:
  name: keeper
  labels:
    app: keeper
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-data
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date) Tick!\" >> /data/out.txt; sleep 1; done"]
      resources: {}
      volumeMounts:
        - name: data
          mountPath: /data
