# A Pod that mounts the PVC at /data and then idles (TASK 2 + 3).
# Fill in the claimName TODO to point at the PVC from pvc.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: keeper
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-data # TODO: name of the PVC to mount (see pvc.yaml)
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date) Tick!\" >> /data/out.txt; sleep 1; done"]
      resources: {}
      volumeMounts:
        - name: data
          mountPath: /data
