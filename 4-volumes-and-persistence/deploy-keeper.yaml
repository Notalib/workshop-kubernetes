# SOLUTION — completed Deployment that mounts the PVC at /data (module 3, TASK 2 + 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keeper
  strategy:
    type: Recreate # Appropriate when you want a single replica and an exclusive volume (only mounted by 1).
  template:
    metadata:
      labels:
        app: keeper
    spec:
      terminationGracePeriodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: # TODO: name of the PVC to mount (see pvc.yaml)
      containers:
        - name: shell
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              trap 'echo "$(date) Stopping gracefully" >> /data/out.txt; exit 0' TERM INT
              echo "$(date) Container started!" >> /data/out.txt
              while true; do
                echo "$(date) Ping" | tee -a /data/out.txt
                sleep 5
              done
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /data
