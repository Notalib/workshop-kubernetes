apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  # TODO: how many identical Pods should run? integer please ;)
  replicas: REPLACE_ME
  # The Deployment finds the Pods it owns (created by Kubernetes) by matching the selector labels.
  # They MUST match .spec.template.metadata.labels below.
  selector:
    matchLabels:
      app: demo

  # The Pod template: a blueprint every replica is created from.
  template:
    metadata:
      labels:
        app: # TODO: which label? (must match the selector above)
    spec:
      containers:
        - name: nginx
          image: # TODO: which image? Pin a tag, don't use :latest. Check https://hub.docker.com
          ports:
            - containerPort: 80
