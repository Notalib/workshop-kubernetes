# The module-1 Deployment, now wired to mount config from ConfigMaps.
# Fill in the TODOs as you work through TASK 1, 2, 4, 5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      volumes:
        - name: demo-html
          configMap:
            # TODO: Replace name with the ConfigMap which holds index.html (see html-configmap.yaml)
            name: "REPLACE_ME"
        - name: demo-config
          configMap:
            name: demo-config

      containers:
        - name: nginx
          image: ghcr.io/notalib/workshop-containerisation/static-web-app:1.2
          resources: {}
          ports:
            - containerPort: 80
          volumeMounts:
            # TASK 1: Apply and check if HTML is replaced
            - name: demo-html
              mountPath: /usr/share/nginx/html

            # TASK 2: mount ONLY default.conf, leaving the rest of conf.d intact.
            # Uncomment this block for TASK 2.
            # - name: demo-config
            #   mountPath: /etc/nginx/conf.d/default.conf
            #   subPath: default.conf
            #   readOnly: true

          # TASK 3 / TASK 4: add an `env:` block here (see the README).
