# The module-1 Deployment, now wired to mount config from ConfigMaps.
# Fill in the TODOs as you work through TASK 1, 2, 4, 5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-pod
  template:
    metadata:
      labels:
        app: web-pod
    spec:
      volumes:
        - name: volume-html
          configMap:
            name: # TODO: Name of the ConfigMap which holds index.html (see configmap-html.yaml)
        - name: volume-nginx-config
          configMap:
            name: nginx-config

      containers:
        - name: web-container
          image: ghcr.io/notalib/workshop-containerisation/static-web-app:1.2
          # Image source: https://github.com/Notalib/workshop-containerisation/blob/solutions/5-static-web-app/Dockerfile
          resources: {}
          ports:
            - containerPort: 80
          volumeMounts:
            # TASK 1: Apply this deployment and check if HTML has been replaced.
            - name: # Which volume (defined above) should you mount?
              mountPath: /usr/share/nginx/html

            # TASK 2: mount ONLY default.conf, leaving the rest of conf.d intact.
            # Uncomment this block for TASK 2.
            # - name: volume-nginx-config
            #   mountPath: /etc/nginx/conf.d/default.conf
            #   subPath: default.conf

          # TASK 3 / TASK 4: Fill in the `env:` block here (see README).
          env:
            - name: FOO
              value: bar
---
# Filled out Service and Ingress included, to make testing easier.
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web-pod
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
