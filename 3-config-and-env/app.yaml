# SOLUTION — completed Deployment for module 2 (TASK 1, 2, 5).
# Mounts custom HTML and a single nginx config file, and reads an env var from a
# ConfigMap. Apply the two ConfigMaps first:
#   kubectl apply -f html-configmap.yaml -f nginx-conf-configmap.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-pod
  template:
    metadata:
      labels:
        app: web-pod
    spec:
      volumes:
        - name: volume-html
          configMap:
            name: html
        - name: volume-nginx-config
          configMap:
            name: nginx-config

      containers:
        - name: web-container
          image: ghcr.io/notalib/workshop-containerisation/static-web-app:1.2
          # Image source: https://github.com/Notalib/workshop-containerisation/blob/solutions/5-static-web-app/Dockerfile
          resources: {}
          ports:
            - containerPort: 80
          volumeMounts:
            # TASK 1: custom HTML over nginx's web root.
            - name: volume-html
              mountPath: /usr/share/nginx/html
            # TASK 2: just default.conf, via subPath (leaves the rest of conf.d intact).
            - name: volume-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # TASK 5: env var imported from the ConfigMap (vs. TASK 4's literal value).
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: greeting
---
# Filled out Service and Ingress included, to make testing easier.
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web-pod
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
